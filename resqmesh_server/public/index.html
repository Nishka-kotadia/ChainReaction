<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResQMesh Global Command Center</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: 'Inter', sans-serif; background-color: #0F172A; color: white;
      overflow: hidden;
    }
    #map { width: 100%; height: 100vh; }
    
    /* Overlay UI */
    .header-overlay {
      position: absolute; top: 20px; left: 20px; right: 20px; z-index: 1000;
      display: flex; justify-content: space-between; align-items: center; pointer-events: none;
    }
    .title-card {
      background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 15px 25px; border-radius: 12px; backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); pointer-events: auto;
    }
    .title-card h1 { margin: 0; font-size: 24px; font-weight: 800; color: #38BDF8; letter-spacing: 1px; }
    .title-card p { margin: 5px 0 0; font-size: 14px; color: #94A3B8; }
    
    .stats-card {
      background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 15px 25px; border-radius: 12px; backdrop-filter: blur(10px);
      display: flex; gap: 20px; pointer-events: auto;
    }
    .stat { text-align: center; }
    .stat-value { font-size: 24px; font-weight: 800; color: #10B981; }
    .stat-label { font-size: 12px; color: #94A3B8; text-transform: uppercase; letter-spacing: 1px; }
    
    /* Leaflet Overrides */
    .leaflet-container { background: #0F172A; }
    
    /* Custom Marker CSS */
    .user-marker {
      background: rgba(16, 185, 129, 0.15); border: 2px solid #10B981;
      border-radius: 50%; display: flex; justify-content: center; align-items: center;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
      animation: pulse 2s infinite;
    }
    .user-marker-inner { width: 8px; height: 8px; background: #10B981; border-radius: 50%; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    
    .marker-label {
      background: rgba(15, 23, 42, 0.9); color: white;
      border: 1px solid #10B981; border-radius: 4px; padding: 2px 6px;
      font-size: 11px; font-family: 'Inter', sans-serif; font-weight: 600;
      white-space: nowrap; transform: translate(-50%, 15px);
    }

    /* Custom Victim Marker CSS */
    .victim-marker {
      background: rgba(244, 63, 94, 0.15); border: 2px solid #F43F5E;
      border-radius: 50%; display: flex; justify-content: center; align-items: center;
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.5);
      animation: victimPulse 1.5s infinite;
    }
    .victim-marker-inner { width: 10px; height: 10px; background: #F43F5E; border-radius: 50%; }
    @keyframes victimPulse {
      0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.6); }
      70% { box-shadow: 0 0 0 20px rgba(244, 63, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
    }
    .victim-label {
      background: rgba(15, 23, 42, 0.9); color: #F43F5E;
      border: 1px solid #F43F5E; border-radius: 4px; padding: 2px 6px;
      font-size: 11px; font-family: 'Inter', sans-serif; font-weight: 800;
      white-space: nowrap; transform: translate(-50%, 15px);
    }
  </style>
</head>
<body>

  <div class="header-overlay">
    <div class="title-card">
      <h1>ResQMesh Dashboard</h1>
      <p>Global Live Tracking & Emergency Mesh</p>
    </div>
    <div class="stats-card">
      <div class="stat">
        <div class="stat-value" id="stat-users">0</div>
        <div class="stat-label">Active Users</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-alerts" style="color: #F43F5E;">0</div>
        <div class="stat-label" style="color: #F43F5E;">Active Alerts</div>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    // 1. Initialize Map (Dark Theme)
    const map = L.map('map').setView([0, 0], 2);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    // 2. Connect to local WebSocket
    const socket = io();
    
    // State
    const userMarkers = new Map();
    let isMapCentered = false;

    // Custom Icon Maker
    const createCustomIcon = (userName) => {
      return L.divIcon({
        className: 'custom-div-icon',
        html: `
          <div class="user-marker"><div class="user-marker-inner"></div></div>
          <div class="marker-label">${userName}</div>
        `,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });
    };

    // 3. Listen for Location Updates
    socket.on('location_update', (location) => {
      const { userId, userName, latitude, longitude, timestamp } = location;
      const latlng = [latitude, longitude];

      if (userMarkers.has(userId)) {
        // Update existing marker
        const marker = userMarkers.get(userId);
        marker.setLatLng(latlng);
      } else {
        // Create new marker
        const marker = L.marker(latlng, { icon: createCustomIcon(userName) }).addTo(map);
        userMarkers.set(userId, marker);
        
        // Auto center map on first user
        if (!isMapCentered) {
          map.setView(latlng, 15);
          isMapCentered = true;
        }
      }
      
      // Update UI Stats
      document.getElementById('stat-users').innerText = userMarkers.size;
    });

    // Snapshot of all users
    socket.on('location_snapshot', (locations) => {
      locations.forEach(location => {
        const { userId, userName, latitude, longitude } = location;
        const latlng = [latitude, longitude];
        if (!userMarkers.has(userId)) {
          const marker = L.marker(latlng, { icon: createCustomIcon(userName) }).addTo(map);
          userMarkers.set(userId, marker);
        } else {
          userMarkers.get(userId).setLatLng(latlng);
        }
      });
      document.getElementById('stat-users').innerText = userMarkers.size;
      
      if (!isMapCentered && locations.length > 0) {
        map.setView([locations[0].latitude, locations[0].longitude], 15);
        isMapCentered = true;
      }
    });

    const alertMarkers = new Map();

    const createVictimIcon = (alertType) => {
      return L.divIcon({
        className: 'custom-div-icon',
        html: `
          <div class="victim-marker"><div class="victim-marker-inner"></div></div>
          <div class="victim-label">${alertType.toUpperCase()}</div>
        `,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
    };

    const plotAlert = (alert) => {
      if (!alert.latitude || !alert.longitude) return;

      if (alert.isResolved) {
        if (alertMarkers.has(alert.id)) {
          map.removeLayer(alertMarkers.get(alert.id));
          alertMarkers.delete(alert.id);
          document.getElementById('stat-alerts').innerText = alertMarkers.size;
        }
        return;
      }

      if (alertMarkers.has(alert.id)) return;

      const latlng = [alert.latitude, alert.longitude];
      const marker = L.marker(latlng, { icon: createVictimIcon(alert.alertType || 'SOS') }).addTo(map);
      marker.bindPopup(`<b>${alert.alertType}</b><br>${alert.description}`);
      alertMarkers.set(alert.id, marker);
      
      document.getElementById('stat-alerts').innerText = alertMarkers.size;
    };

    socket.on('alert_history', (alerts) => {
      alerts.forEach(plotAlert);
    });

    socket.on('new_alert', (alert) => {
      plotAlert(alert);
    });

  </script>
</body>
</html>
